services:
    server:
        build:
            context: .
        # auth-server has separate, statically-imported entry points for each datastore backend
        # (server.mongo.ts/server.sql.ts) rather than one script that branches on env vars at runtime -
        # the image's own default CMD (dist/src/server.js) is hardwired to Mongo, so this must be set
        # explicitly here or this file would silently run against Mongo config regardless of every
        # Postgres env var set below.
        command: ["node", "dist/src/server.sql.js"]
        ports:
            - "3000:3000"
            - "9229:9229"
        environment:
            - datastores__acl__url=postgres://postgres:postgres@postgres:5432/postgres
            - datastores__cache__type=redis
            - datastores__cache__url=redis://redis
            - datastores__events__type=redis
            - datastores__events__url=redis://redis
            - datastores__logs__type=redis
            - datastores__logs__url=redis://redis
            - datastores__sql__url=postgres://postgres:postgres@postgres:5432/postgres
            - NODE_ENV=${NODE_ENV:-dev}
        links:
            - redis
            - postgres
        # Wait for the databases to accept connections: the server does not retry its first connection, so one that is
        # still starting (Postgres runs its first-boot initdb, slower on a busy CI runner) made it exit before it was ready.
        depends_on:
            redis:
                condition: service_healthy
            postgres:
                condition: service_healthy
    redis:
        image: redis
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 2s
            timeout: 3s
            retries: 30
    postgres:
        image: postgres
        environment:
            - POSTGRES_PASSWORD=postgres
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 2s
            timeout: 3s
            retries: 60
        volumes:
            # NOT /var/lib/postgresql/data - the postgres:18+ image refuses to start at all if anything is
            # externally mounted directly at that exact path ("these Docker images are configured to store
            # database data in a format which is compatible with pg_ctlcluster... there appears to be
            # PostgreSQL data in /var/lib/postgresql/data (unused mount/volume)"), even an empty freshly-
            # created volume - confirmed live, this crash-looped this service. The image wants the *parent*
            # directory so it can manage its own major-version-qualified subdirectory underneath it.
            - postgres_data:/var/lib/postgresql

volumes:
    postgres_data:
