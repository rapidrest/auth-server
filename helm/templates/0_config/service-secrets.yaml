---
{{- $name := printf "%s-service-secrets" (include "rrst.fullname" .) }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
type: Opaque
data:
  {{- $default_accounts := dig "data" "default_accounts" "" $existing }}
  {{- if not $default_accounts }}
  {{-   $default_accounts = include "rrst.getDefaultAccounts" . | b64enc }}
  {{- end }}
  default_accounts: {{ $default_accounts }}
# Cookie and session signing secrets. Kept in a Secret (not the ConfigMap) and generated only once: an empty
# cookies.secret/sessions.secret gets a random value on install that later upgrades read back from this Secret, so signed
# cookies and sessions stay valid across an upgrade and every replica shares the same values. An explicit value always
# wins. With secrets.existingSecret, that Secret is used instead and nothing is rendered here.
#
# A value set under service.config (cookie_secret, session__secret) counts as explicit too: this Secret is a later
# envFrom source than the ConfigMap, so a generated value here would silently override it.
{{- if and (not .Values.global.secrets.existingSecret) (ne (include "rrst.vaultManagedSecrets" .) "true") }}
{{-   $stored := (get $existing "data") | default dict }}
{{-   $config := .Values.service.config | default dict }}
{{-   $explicit := dict }}
{{-   $generated := list }}
{{-   range $key, $spec := dict "cookie_secret" (list "global.secrets.cookies" .Values.global.secrets.cookies) "session__secret" (list "global.secrets.sessions" .Values.global.secrets.sessions) }}
{{-     $value := index $spec 1 | default "" | toString }}
{{-     if and (not $value) (hasKey $config $key) }}
{{-       $value = index $config $key | default "" | toString }}
{{-     end }}
{{-     $_ := set $explicit $key $value }}
{{-     if not (tpl $value $) }}
{{-       $generated = append $generated (index $spec 0) }}
{{-     end }}
{{-   end }}
{{-   if not (tpl (.Values.global.jwt.secret | default "" | toString) .) }}
{{-     $generated = append $generated "jwt.secret" }}
{{-   end }}
{{- /*
    AES-256 keys (64 hex chars) that encrypt secrets at rest: the OAuth authorization-server signing keys
    (auth:oauth_server:keys:encryption_key) and every user's TOTP/MFA shared secret (auth:totp:encryption_key).
    Generated and persisted here so a default install is never left on the checked-in public OAuth default key, and so
    TOTP secrets are not stored in plaintext (the framework stores them in the clear when the key is unset). An explicit
    value under service.config still wins, and the stored value is read back on upgrade so already-encrypted data stays
    readable. Set either under service.config to rotate deliberately rather than regenerate.
*/}}
{{-   range $key := list "auth__oauth_server__keys__encryption_key" "auth__totp__encryption_key" }}
{{-     $value := "" }}
{{-     if hasKey $config $key }}
{{-       $value = index $config $key | default "" | toString }}
{{-     end }}
{{-     $_ := set $explicit $key $value }}
{{-     if not (tpl $value $) }}
{{-       $generated = append $generated $key }}
{{-     end }}
{{-   end }}
{{-   include "rrst.assertStableSecrets" (dict "missing" $generated "context" .) }}
  cookie_secret: {{ include "rrst.persistedSecret" (dict "value" (get $explicit "cookie_secret") "stored" (get $stored "cookie_secret") "context" .) | quote }}
  session__secret: {{ include "rrst.persistedSecret" (dict "value" (get $explicit "session__secret") "stored" (get $stored "session__secret") "context" .) | quote }}
  auth__oauth_server__keys__encryption_key: {{ include "rrst.persistedHexSecret" (dict "value" (get $explicit "auth__oauth_server__keys__encryption_key") "stored" (get $stored "auth__oauth_server__keys__encryption_key") "context" .) | quote }}
  auth__totp__encryption_key: {{ include "rrst.persistedHexSecret" (dict "value" (get $explicit "auth__totp__encryption_key") "stored" (get $stored "auth__totp__encryption_key") "context" .) | quote }}
{{- end }}
