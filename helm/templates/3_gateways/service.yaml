{{- $ownsGateway := and (eq (printf "%s-gateway" (include "rrst.fullname" .)) (tpl $.Values.global.gateway.name $)) (eq $.Release.Namespace (tpl $.Values.global.gateway.namespace $)) }}
{{- /* Matches tls-certs.yaml: a certificate is only issued for a host that can get one. */}}
{{- $certificate := eq (include "rrst.certificate" $) "true" }}
{{- /*
Plain HTTP is redirected to HTTPS when this chart owns the Gateway and terminates TLS on it: the http and https listeners are
named here, so the redirect can be attached to the http ones only (a Gateway it doesn't own names its own listeners, which
this can't tell apart). cert-manager's HTTP-01 solver route matches its own /.well-known/acme-challenge/<token> path exactly,
which wins over this route's `/` prefix, so certificates are still issued over HTTP.
*/}}
{{- $redirectHTTP := and $ownsGateway $certificate $.Values.global.gateway.httpRedirect }}
{{- if $ownsGateway }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "rrst.fullname" . }}-gateway
spec:
  gatewayClassName: {{ $.Values.global.gateway.className | quote }}
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    hostname: {{ (include "rrst.render" (dict "value" $.Values.host "context" $)) | quote }}
    allowedRoutes:
      namespaces:
        from: All
  {{- if $certificate }}
  # TLS is terminated on the listener; an HTTPRoute has no `tls` field.
  - name: https
    protocol: HTTPS
    port: 443
    hostname: {{ (include "rrst.render" (dict "value" $.Values.host "context" $)) | quote }}
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: {{ (include "rrst.render" (dict "value" $.Values.host "context" $)) }}-tls-cert
    allowedRoutes:
      namespaces:
        from: All
  {{- end }}
{{- end }}
{{- if and (not $ownsGateway) $certificate }}
---
# The Gateway that terminates TLS for `host` lives in another namespace, so it may only read the certificate Secret in
# this one because this says so.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: {{ include "rrst.fullname" . }}-tls-cert
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: Gateway
    namespace: {{ tpl $.Values.global.gateway.namespace $ }}
  to:
  - group: ""
    kind: Secret
    name: {{ (include "rrst.render" (dict "value" $.Values.host "context" $)) }}-tls-cert
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  # Chart-name-qualified (not a bare "api-httproute") so a parent chart depending on this one as a
  # subchart - each with its own hostname/backendRefs attached to one shared Gateway - doesn't have both
  # charts' HTTPRoutes collide under the same literal resource name, silently clobbering one route with
  # the other on every `helm upgrade`.
  name: {{ include "rrst.fullname" . }}-httproute
spec:
  parentRefs:
  {{- if $ownsGateway }}
  {{- if not $redirectHTTP }}
  - name: {{ tpl $.Values.global.gateway.name $ }}
    namespace: {{ tpl $.Values.global.gateway.namespace $ }}
    sectionName: http
  {{- end }}
  {{- if $certificate }}
  - name: {{ tpl $.Values.global.gateway.name $ }}
    namespace: {{ $.Release.Namespace }}
    sectionName: https
  {{- end }}
  {{- else }}
  # A Gateway this chart doesn't own (global.gateway.name/namespace) has listeners it names itself, so the route names
  # none: it attaches to whichever listeners accept this hostname - the HTTP one and, once it has a certificate for
  # `host`, the HTTPS one.
  - name: {{ tpl $.Values.global.gateway.name $ }}
    namespace: {{ tpl $.Values.global.gateway.namespace $ }}
  {{- end }}
  hostnames:
  - {{ (include "rrst.render" (dict "value" $.Values.host "context" $)) | quote }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ include "rrst.fullname" . }}-services
      port: 80
    # Baseline security response headers for every served response. A standard Gateway API filter, so it works on any
    # implementation (Envoy Gateway, nginx-gateway-fabric, ...). Kept in step with the RapidMX server chart's own route.
    filters:
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        set:
        # Stops a browser from MIME-sniffing a response into a type it wasn't sent as.
        - name: X-Content-Type-Options
          value: nosniff
        - name: Referrer-Policy
          value: strict-origin-when-cross-origin
        {{- if $.Values.global.gateway.hsts }}
        # HTTPS enforced for two years. `host` has no sub-names of its own, so includeSubDomains costs nothing here;
        # `preload` is left to the operator since it is slow to undo.
        - name: Strict-Transport-Security
          value: max-age=63072000; includeSubDomains
        {{- end }}
        add:
        # Added, not set, so it layers with - never replaces - any stricter per-response CSP the app sends; a browser
        # enforces every CSP it receives. `frame-ancestors 'self'` blocks cross-origin framing (clickjacking) while still
        # allowing same-origin framing; a blunt `X-Frame-Options: DENY` would break any same-origin iframe, so it is not
        # used. A `script-src` policy needs per-response SSR nonces (a separate change) and so is deliberately omitted.
        - name: Content-Security-Policy
          value: "frame-ancestors 'self'; object-src 'none'; base-uri 'self'"
        {{- if not $.Values.global.gateway.hsts }}
        remove:
        - Strict-Transport-Security
        {{- end }}

{{- if $redirectHTTP }}
---
# Sends everything arriving over plain HTTP to the same address over HTTPS. The app route above is attached to the https
# listener only, so no request is served in the clear (global.gateway.httpRedirect: false serves both).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "rrst.fullname" . }}-httproute-redirect
spec:
  parentRefs:
  - name: {{ tpl $.Values.global.gateway.name $ }}
    namespace: {{ tpl $.Values.global.gateway.namespace $ }}
    sectionName: http
  hostnames:
  - {{ (include "rrst.render" (dict "value" $.Values.host "context" $)) | quote }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
{{- end }}
