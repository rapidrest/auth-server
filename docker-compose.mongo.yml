services:
    server:
        build:
            context: .
        # auth-server has separate, statically-imported entry points for each datastore backend
        # (server.mongo.ts/server.sql.ts) rather than one script that branches on env vars at runtime -
        # the image's own default CMD (dist/src/server.js) is hardwired to Mongo, so this must be set
        # explicitly here or a docker-compose.sql.yml-based install would silently run against Mongo
        # config regardless of every Postgres env var set below.
        command: ["node", "dist/src/server.mongo.js"]
        ports:
            - "3000:3000"
            - "9229:9229"
        environment:
            - datastores__acl__url=mongodb://mongo
            - datastores__cache__type=redis
            - datastores__cache__url=redis://redis
            - datastores__events__type=redis
            - datastores__events__url=redis://redis
            - datastores__logs__type=redis
            - datastores__logs__url=redis://redis
            - datastores__mongo__url=mongodb://mongo
            - NODE_ENV=${NODE_ENV:-dev}
        links:
            - redis
            - mongo
        # Wait for the databases to accept connections (see docker-compose.sql.yml).
        depends_on:
            redis:
                condition: service_healthy
            mongo:
                condition: service_healthy
    redis:
        image: redis
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 2s
            timeout: 3s
            retries: 30
    mongo:
        image: mongo
        volumes:
            - mongo_data:/data/db
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            interval: 2s
            timeout: 5s
            retries: 60

volumes:
    mongo_data:
